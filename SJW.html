<style>

<script>
'use strict';
/* ========== UTILITIES ========== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const N=n=>Number(n||0).toLocaleString('en-IN');
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const D=s=>{if(!s)return'—';const[y,m,d]=s.split('-');return d+'-'+MON[m-1]+'-'+y};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fyOf=s=>{const y=+s.slice(0,4),m=+s.slice(5,7),a=m>=4?y:y-1;return String(a).slice(2)+String(a+1).slice(2)};
const hash=s=>{let a=2166136261,b=5381;for(let i=0;i<s.length;i++){a^=s.charCodeAt(i);a=Math.imul(a,16777619);b=(b*33)^s.charCodeAt(i)}return(a>>>0).toString(16)+(b>>>0).toString(16)};
const ue=m=>{const e=new Error(m);e.ue=1;return e};
const msg=e=>e.ue?e.message:e.message==='STALE'?'This record was changed in another window. Reload the page and try again.':e.message==='DUP'?'This customer already has a lot with that number. Use a different lot number.':MSGX[e.message]||'Could not save. Please try again.';

/* ========== DATA ACCESS SECTION (replace this whole block with Firebase later) ==========
   Screens only call DA.*; nothing outside this block touches IndexedDB. */
const DA=(()=>{
const NAME='sjw_app_db',VER=5;let db,blk='',lockT='',usr={};
const ST={employees:null,customers:null,lookups:'kind',lots:'customerId',intake:'lotId',settings:null,audit:null,meta:null};
const ST2={prod:'lotId',qc:'lotId',resol:'lotId'},ST3={disp:'lotId',pay:'workerId',adj:'workerId'},ST4={bill:'customerId',rcpt:'customerId',exp:'date',claim:'lotId'},ST5={users:null,opening:'kind',implog:null,snap:null},LKS=new Set(['prod','qc','resol','disp','pay','adj','bill','rcpt','exp','claim','intake','opening']);
function migrate(d,old){ /* versioned schema: add new "if(old<2){...}" blocks for later versions */
 if(old<1)for(const s in ST){const o=d.createObjectStore(s,{keyPath:'id'});if(ST[s])o.createIndex(ST[s],ST[s])}
 if(old<2)for(const s in ST2){const o=d.createObjectStore(s,{keyPath:'id'});o.createIndex(ST2[s],ST2[s])}
 if(old<3)for(const s in ST3){const o=d.createObjectStore(s,{keyPath:'id'});o.createIndex(ST3[s],ST3[s])}
 if(old<4)for(const s in ST4){const o=d.createObjectStore(s,{keyPath:'id'});o.createIndex(ST4[s],ST4[s])}
 if(old<5)for(const s in ST5){const o=d.createObjectStore(s,{keyPath:'id'});if(ST5[s])o.createIndex(ST5[s],ST5[s])}}
const rq=r=>new Promise((a,b)=>{r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)});
const openNamed=nm=>new Promise((a,b)=>{const r=indexedDB.open(nm,VER);r.onupgradeneeded=e=>migrate(r.result,e.oldVersion);r.onsuccess=()=>{r.result.onversionchange=()=>r.result.close();a(r.result)};r.onerror=()=>b(r.error)});
async function open(){db=await openNamed(NAME)}
function run(names,fn,byp){return new Promise((a,b)=>{if(blk&&!byp){b(new Error(blk));return}const t=db.transaction(names,'readwrite');let out;t.oncomplete=()=>a(out);t.onerror=()=>b(t.error);t.onabort=()=>b(t.error||new Error('ABORT'));fn(t).then(v=>out=v).catch(e=>{try{t.abort()}catch(_){}b(e)})})}
async function put(t,s,r){const o=t.objectStore(s),c=await rq(o.get(r.id));if((r.rev||0)!==(c?c.rev:0))throw new Error('STALE');if(lockT&&LKS.has(s)&&r.date&&r.date<=lockT)throw new Error('LOCKED');if(!c&&usr.id&&!r.by)r.by=usr.id;r.rev=(c?c.rev:0)+1;await rq(o.put(r));return r}
async function aud(t,a){const m=t.objectStore('meta'),h=(await rq(m.get('head')))||{id:'head',hash:'0',rev:0};
 const e={id:uid('au'),ts:new Date().toISOString(),tz:Intl.DateTimeFormat().resolvedOptions().timeZone,rev:h.rev+1,user:usr.name?usr.name+' ('+usr.role+')':'Owner',prev:h.hash,...a};
 e.hash=hash(h.hash+JSON.stringify([e.ts,e.entity,e.eid,e.action,e.old,e.neu,e.reason]));
 await rq(t.objectStore('audit').put(e));await rq(m.put({id:'head',hash:e.hash,rev:e.rev,ts:e.ts}))}
const commit=(puts,au)=>run([...new Set([...puts.map(p=>p[0]),'audit','meta'])],async t=>{for(const[s,r]of puts)await put(t,s,r);if(au)await aud(t,au)});
async function nextNo(t,key,pref,date,reset){const y=reset==='yearly',k='seq-'+key+(y?fyOf(date):''),m=t.objectStore('meta'),q=(await rq(m.get(k)))||{id:k,n:0};q.n++;await rq(m.put(q));return pref+'-'+(y?fyOf(date)+'-':'')+String(q.n).padStart(4,'0')}
const numbered=(store,key,ent)=>(r,au,o)=>run([store,'meta','audit'],async t=>{if(!r.no)r.no=await nextNo(t,key,o.prefix,r.date,o.reset);await put(t,store,r);await aud(t,{entity:ent,eid:r.id,...au});return r});
return{
 open,
 all:s=>rq(db.transaction(s).objectStore(s).getAll()),
 save:(s,r,au)=>commit([[s,r]],au),
 bulk:(s,rows,au)=>commit(rows.map(r=>[s,r]),au),
 saveEmployee:(r,au)=>commit([['employees',r]],au),
 saveCustomer:(r,au)=>commit([['customers',r]],au),
 saveLookup:(r,au)=>commit([['lookups',r]],au),
 saveIntake:(e,au)=>commit([['intake',e]],au),
 saveProd:(r,au)=>commit([['prod',r]],au),
 saveQc:(r,au)=>commit([['qc',r]],au),
 saveResol:(r,au)=>commit([['resol',r]],au),
 saveDisp:numbered('disp','disp','dispatch'),
 savePay:numbered('pay','pay','payment'),
 saveAdj:(r,au)=>commit([['adj',r]],au),
 saveBill:numbered('bill','bill','bill'),
 saveRcpt:numbered('rcpt','rcpt','receipt'),
 saveExp:(r,au)=>commit([['exp',r]],au),
 saveClaim:(c,au,o,adj)=>run(['claim','adj','meta','audit'],async t=>{if(!c.no)c.no=await nextNo(t,'claim',o.prefix,c.date,o.reset);await put(t,'claim',c);if(adj)await put(t,'adj',adj);await aud(t,{entity:'claim',eid:c.id,...au});return c}),
 saveSettings:(r,au)=>commit([['settings',r]],au||{entity:'settings',eid:'main',action:'edit',reason:'Settings updated'}),
 /* Lot + its intake events + lot-number counter + audit entry: ONE atomic transaction */
 saveLot:(lot,evs,au,prefix)=>run(['lots','intake','meta','audit'],async t=>{
  if(!lot.lotNo){
   const ex=await rq(t.objectStore('lots').index('customerId').getAll(lot.customerId));
   if(ex.some(x=>x.custNo.trim().toLowerCase()===lot.custNo.trim().toLowerCase()))throw new Error('DUP');
   const k='seq'+fyOf(lot.receiptDate),m=t.objectStore('meta'),q=(await rq(m.get(k)))||{id:k,n:0};q.n++;await rq(m.put(q));
   lot.lotNo=prefix+'-'+fyOf(lot.receiptDate)+'-'+String(q.n).padStart(4,'0');
  }
  await put(t,'lots',lot);for(const e of evs)await put(t,'intake',e);await aud(t,{entity:'lot',eid:lot.id,neu:au.neu,...au});return lot}),
 VER,storeNames:()=>[...Object.keys(ST),...Object.keys(ST2),...Object.keys(ST3),...Object.keys(ST4),...Object.keys(ST5)].filter(s=>s!=='snap'),
 setBlock:x=>{blk=x||''},setLock:d=>{lockT=d||''},setUser:u=>{usr=u||{}},
 getMeta:id=>rq(db.transaction('meta').objectStore('meta').get(id)),
 putMeta:(r,au)=>run(['meta','audit'],async t=>{await rq(t.objectStore('meta').put(r));if(au)await aud(t,au)},true),
 multi:(puts,au)=>commit(puts,au),saveUser:(r,au)=>commit([['users',r]],au),
 saveSnap:s=>run(['snap'],async t=>{const o=t.objectStore('snap');await rq(o.put(s));const all=(await rq(o.getAll())).sort((a,b)=>b.ts.localeCompare(a.ts));for(const x of all.slice(3))await rq(o.delete(x.id))},true),
 dumpAll:async()=>{const n=DA.storeNames(),tx=db.transaction(n),o={};for(const s of n)o[s]=await rq(tx.objectStore(s).getAll());return o},
 restoreAll:(data,au)=>{const n=DA.storeNames();return run(n,async t=>{for(const s of n){const o=t.objectStore(s);await rq(o.clear());for(const r of(data[s]||[]))await rq(o.put(r))}await aud(t,au)},true)},
 wipe:()=>{const n=[...DA.storeNames(),'snap'];return run(n,async t=>{for(const s of n)await rq(t.objectStore(s).clear())},true)},
 scratch:async fn=>{const prev=db,keep=[blk,lockT,usr],nm='sjw_selftest_db';await new Promise(r=>{const q=indexedDB.deleteDatabase(nm);q.onsuccess=q.onerror=q.onblocked=()=>r()});db=await openNamed(nm);blk='';lockT='';usr={name:'Self-test',role:'Owner'};try{return await fn()}finally{try{db.close()}catch(e){}db=prev;[blk,lockT,usr]=keep;indexedDB.deleteDatabase(nm)}},
 getHead:()=>rq(db.transaction('meta').objectStore('meta').get('head')),
 getAudit:()=>rq(db.transaction('audit').objectStore('audit').getAll()),
 clearAll:()=>{db.close();const r=indexedDB.deleteDatabase(NAME);r.onsuccess=r.onerror=r.onblocked=()=>location.reload()},
 persist:()=>{try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}}
}})();
/* ========== END DATA ACCESS SECTION ========== */

/* ========== SETTINGS (Appendix D) ========== */
const SCH=[
['Rules','excess','Excess receipt','sel',[['warn','Allow with warning'],['allow','Allow'],['block','Block']]],
['Rules','multiOps','Track multiple operations','bool'],['Rules','workerRate','Worker-specific rate override','bool'],
['Rules','inspection','Inspection mode','sel',[['100','100% inspection'],['sampled','Sampled']]],['Rules','samplePct','Sample % (if sampled)','num'],
['Rules','reqTicket','Require bundle ticket on QC','bool'],['Rules','reqSize','Require size on QC','bool'],['Rules','mismatchQC','Allow mismatch finding at QC','bool'],
['Rules','clawback','Mismatch clawback method','sel',[['auto','Auto-recover from next payment'],['case','Case by case'],['absorb','Company absorbs']]],
['Rules','provisional','Provisional QC entries','sel',[['warn','Allow with warning'],['allow','Allow'],['block','Block']]],
['Rules','altPay','Alteration payment (different person)','sel',[['paid','Paid at alteration rate if entered'],['unpaid','Unpaid']]],
['Rules','unspec','Allow "Unspecified" defect reason','bool'],['Rules','lowSample','Low-sample threshold (pieces)','num'],
['Rules','workerLiab','Worker liability for damage','sel',[['none','None'],['charge','Charge worker']]],
['Rules','loanMode','Loan recovery per payment','sel',[['none','None'],['fixed','Fixed ₹'],['pct','% of gross']]],['Rules','loanVal','Loan recovery value','num'],
['Billing and reports','billable','Billable quantity rule','sel',[['dispatched','Dispatched finished goods'],['completed','Good completed'],['qc','Fresh QC passed']]],
['Billing and reports','revRec','Revenue recognition','sel',[['dispatch','Dispatch date'],['billing','Billing date'],['production','Production completion'],['qc','Fresh QC pass']]],
['Billing and reports','plView','P&L labour view','sel',[['incurred','As incurred'],['matched','Matched to revenue']]],
['Billing and reports','tax','Tax mode','sel',[['off','Off'],['gst','GST registered']]],
['Billing and reports','expBasis','Expense reporting basis','sel',[['incurred','Incurred date'],['paid','Paid date']]],

 S.bl.forEach(b=>{if(b.customerId===cid)L.push({k:'Bill',d:b.date,ts:b.ts,id:b.id,amt:b.total,bill:1,t:`${b.no} · ${lotName(b.lotId)} · taxable ${Rs(b.taxable)}${b.tax?' + GST '+Rs(b.tax):''}`})});
 S.op.forEach(o=>{if(o.customerId!==cid)return;if(o.kind==='cdue')L.push({k:'Opening due',d:o.date,ts:o.ts||'',id:o.id,amt:o.amount,bill:1,t:'Opening bill '+(o.billNo||'')});if(o.kind==='cadv')L.push({k:'Opening advance',d:o.date,ts:o.ts||'',id:o.id,amt:-o.amount,t:'Advance held at go-live'})});
 S.rc.forEach(r=>{if(r.customerId===cid)L.push({k:RK[r.kind],d:r.date,ts:r.ts,id:r.id,amt:-r.amount,t:[r.no,CASHK.includes(r.kind)?r.method:'',r.ref,r.reason&&r.reason!=='—'?r.reason:'',r.note].filter(Boolean).join(' · ')})});
 L.sort((a,b)=>a.d.localeCompare(b.d)||a.ts.localeCompare(b.ts));let b=0;L.forEach(x=>{b=r2(b+x.amt);x.bal=b});return L}
function cfifo(cid){const L=cledger(cid),bills=L.filter(x=>x.bill),cr=r2(-sm(L.filter(x=>!x.bill),'amt')),bal=L.length?L[L.length-1].bal:0;let rem=cr;const alloc={};
 bills.forEach(b=>{const a=Math.min(Math.max(rem,0),b.amt);alloc[b.id]=r2(a);rem=r2(rem-a)});return{L,bal,billed:r2(sm(bills,'amt')),credits:cr,alloc,due:Math.max(0,bal),adv:Math.max(0,-bal),bills}}
function ageing(cid){const F=cfifo(cid),B=[0,0,0,0];F.bills.forEach(b=>{const o=r2(b.amt-F.alloc[b.id]);if(o>0){const n=dd(today(),b.d);B[n<=30?0:n<=60?1:n<=90?2:3]+=o}});return B}
